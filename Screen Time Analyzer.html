<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Screen Time Analyzer</title>
<style>
:root{--bg:#fafaf8;--fg:#1d1d1b;--card:#fff;--line:#ddd9d0;--acc:#2f6f5e;--warn:#b25b00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--fg:#ecebe6;--card:#1f1f1d;--line:#3a3a36;--acc:#6fc4ab;--warn:#f0a259}}
:root[data-theme="dark"]{--bg:#151514;--fg:#ecebe6;--card:#1f1f1d;--line:#3a3a36;--acc:#6fc4ab;--warn:#f0a259}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
p.sub{margin:0 0 16px;opacity:.7;font-size:.95rem}
textarea{width:100%;min-height:170px;box-sizing:border-box;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit;resize:vertical}
.row{display:flex;gap:8px;margin:10px 0 20px;flex-wrap:wrap}
button{padding:9px 16px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:#fff;font:inherit;cursor:pointer}
button.ghost{background:transparent;color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 8px;font-size:1.05rem}
.bar{height:8px;border-radius:4px;background:var(--line);margin:4px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.summary{font-size:1.02rem}
.warn{color:var(--warn);font-size:.92rem}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
</style>
</head>
<body>
<main>
<h1>Screen Time Analyzer</h1>
<p class="sub">Paste entries in the form: <b>App Date Time Reason Duration</b> (one per line works best, but a single run-on line is fine too).</p>
<textarea id="in" placeholder="Youtube Oct 5, 2026 at 6:01 PM Study 10min&#10;Threads Oct 6, 2026 at 6:30 PM Just for fun 15min"></textarea>
<div class="row">
  <button id="go">Analyze</button>
  <button class="ghost" id="ex">Load example</button>
  <button class="ghost" id="clr">Clear</button>
</div>
<div id="out"></div>
</main>
<script>
const MONTHS={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ANCHOR=/([A-Za-z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{4})(?:\s+at)?\s+(\d{1,2}):(\d{2})\s*([AaPp][Mm])?/g;
const DUR=/(\d+(?:\.\d+)?)\s*(hours?|hrs?|h|minutes?|mins?|m)\b/gi;

function fmt(min){
  min=Math.round(min);
  const h=Math.floor(min/60),m=min%60;
  if(!h)return m+' min';
  return m?`${h} h ${m} min`:`${h} h`;
}
function fmtDate(d){return `${MN[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function parse(text){
  const anchors=[];let m;ANCHOR.lastIndex=0;
  while((m=ANCHOR.exec(text))){
    const mo=MONTHS[m[1].slice(0,3).toLowerCase()];
    if(mo===undefined)continue;
    let hr=+m[4];const ap=(m[6]||'').toLowerCase();
    if(ap==='pm'&&hr<12)hr+=12;if(ap==='am'&&hr===12)hr=0;
    anchors.push({start:m.index,end:m.index+m[0].length,date:new Date(+m[3],mo,+m[2],hr,+m[5])});
  }
  const entries=[];
  anchors.forEach((a,i)=>{
    // app: text before this anchor (after previous entry's body)
    let app;
    if(i===0){app=text.slice(0,a.start).trim().split(/\n/).pop().trim()}
    else{app=a.appNext}
    const next=anchors[i+1];
    let gap=text.slice(a.end,next?next.start:text.length);
    if(next){
      const nl=gap.lastIndexOf('\n');
      let appNext;
      if(nl>=0){appNext=gap.slice(nl+1).trim();gap=gap.slice(0,nl)}
      else{const t=gap.trimEnd();const sp=t.search(/\S+$/);appNext=t.slice(sp);gap=t.slice(0,sp)}
      next.appNext=appNext;
    }
    let dur=0,found=false;
    gap=gap.replace(DUR,(all,n,u)=>{found=true;dur+=/^h/i.test(u)?n*60:+n;return ' '});
    const reason=gap.replace(/\s+/g,' ').trim()||'(no reason)';
    entries.push({app:app||'(unknown app)',date:a.date,reason,dur,hasDur:found});
  });
  return entries;
}

function analyze(){
  const out=document.getElementById('out');
  const entries=parse(document.getElementById('in').value);
  if(!entries.length){out.innerHTML='<p class="warn">No entries found. Each entry needs a date and time like "Oct 5, 2026 at 6:01 PM".</p>';return}
  const apps=new Map();
  for(const e of entries){
    const ak=e.app.toLowerCase();
    if(!apps.has(ak))apps.set(ak,{name:e.app,total:0,reasons:new Map()});
    const a=apps.get(ak);a.total+=e.dur;
    const rk=e.reason.toLowerCase();
    if(!a.reasons.has(rk))a.reasons.set(rk,{name:e.reason,min:0});
    a.reasons.get(rk).min+=e.dur;
  }
  const dates=entries.map(e=>e.date);
  const lo=new Date(Math.min(...dates)),hi=new Date(Math.max(...dates));
  const range=fmtDate(lo)===fmtDate(hi)?`On ${fmtDate(lo)}`:`From ${fmtDate(lo)} to ${fmtDate(hi)}`;
  const sorted=[...apps.values()].sort((a,b)=>b.total-a.total);
  const grand=sorted.reduce((s,a)=>s+a.total,0)||1;
  const missing=entries.filter(e=>!e.hasDur);

  let html=`<div class="card summary"><h2>Summary</h2><p>${esc(range)}, you spent a total of <b>${fmt(grand===1&&!sorted[0].total?0:grand)}</b> across ${sorted.length} app${sorted.length>1?'s':''}.</p>`;
  for(const a of sorted){
    const rs=[...a.reasons.values()].sort((x,y)=>y.min-x.min).map(r=>`${fmt(r.min)} because of ${esc(r.name.toLowerCase())}`);
    const list=rs.length>1?rs.slice(0,-1).join(', ')+' and '+rs[rs.length-1]:rs[0];
    html+=`<p>You spent a total of <b>${fmt(a.total)}</b> on ${esc(a.name)}, with ${list}.</p>`;
  }
  html+='</div>';
  if(missing.length){
    html+=`<div class="card"><p class="warn">${missing.length} entr${missing.length>1?'ies have':'y has'} no duration and counted as 0 min: ${missing.map(e=>esc(e.app)+' ('+esc(e.reason)+')').join(', ')}. Add a duration like "20min" to include ${missing.length>1?'them':'it'}.</p></div>`;
  }
  for(const a of sorted){
    html+=`<div class="card"><h2>${esc(a.name)} &middot; ${fmt(a.total)}</h2>`;
    for(const r of [...a.reasons.values()].sort((x,y)=>y.min-x.min)){
      const pct=a.total?r.min/a.total*100:0;
      html+=`<div>${esc(r.name)} <span style="opacity:.7">&mdash; ${fmt(r.min)} (${Math.round(pct)}%)</span></div><div class="bar"><i style="width:${pct}%"></i></div>`;
    }
    html+='</div>';
  }
  html+=`<div class="card"><h2>Parsed entries</h2><div class="scroll"><table><tr><th>App</th><th>Date</th><th>Reason</th><th>Duration</th></tr>${entries.map(e=>`<tr><td>${esc(e.app)}</td><td>${fmtDate(e.date)} ${e.date.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</td><td>${esc(e.reason)}</td><td>${e.hasDur?fmt(e.dur):'&mdash;'}</td></tr>`).join('')}</table></div></div>`;
  out.innerHTML=html;
}
document.getElementById('go').onclick=analyze;
document.getElementById('clr').onclick=()=>{document.getElementById('in').value='';document.getElementById('out').innerHTML=''};
document.getElementById('ex').onclick=()=>{
  document.getElementById('in').value='Youtube Oct 5, 2026 at 6:01 PM Study 10min\nThreads Oct 6, 2026 at 6:30 PM Just for fun 15min\nYoutube Oct 6, 2026 10:00PM Study 30min\nThreads Oct 6, 2026 11:00 PM Chatting with friends 20min';
  analyze();
};
</script>
</body>
</html>
